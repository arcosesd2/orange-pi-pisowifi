#!/usr/sbin/nft -f
# PisoWiFi captive-portal ruleset.
# LAN_IF / WAN_IF / CLIENT_NET are rewritten at every boot by network/detect.sh
# from the hardware actually present. The #@ANTI_TETHER@ / #@FLOWTABLE@ /
# #@OFFLOAD@ tokens are filled in (or blanked) from the `anti_tether` and
# `flow_offload` config toggles.
# When a VLAN is configured (lan_vlan), LAN_IF is the tagged sub-interface (eth0.5).

# Interface names are quoted (they are strings); CLIENT_NET must NOT be. nft
# treats a quoted value as a hostname to resolve, so "10.0.0.0/24" fails with
# "Could not resolve hostname" on nftables >= 1.1 (Debian 13 ships 1.1.3).
# Debian 12's 1.0.6 accepted it, which is why this went unnoticed.
define LAN_IF     = "wlan0"
define WAN_IF     = "eth0"
define CLIENT_NET = 10.0.0.0/24
define PORTAL_PORT = 8080

flush ruleset

table inet pisowifi {

    # Paid clients — elements time out, so the kernel revokes access itself.
    set allowed   { type ether_addr; flags timeout; }
    # Always-on free devices (owner phone, CCTV, POS).
    set whitelist { type ether_addr; }
    # Banned devices — dropped everywhere.
    set blocked   { type ether_addr; }
    # Walled garden: destinations unpaid clients may still reach.
    set walled    { type ipv4_addr; flags interval; }
    # Per-client connection counter (anti conntrack-exhaustion).
    set conn_limit { typeof ip saddr; flags dynamic; }

#@FLOWTABLE@

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        iifname $LAN_IF ether saddr @blocked drop
        iifname $LAN_IF ether saddr @allowed accept
        iifname $LAN_IF ether saddr @whitelist accept
        iifname $LAN_IF ip daddr @walled accept

        # Unpaid: force DNS local, hijack HTTP to the portal (HTTPS not touched).
        iifname $LAN_IF udp dport 53 redirect to :53
        iifname $LAN_IF tcp dport 53 redirect to :53
        iifname $LAN_IF tcp dport 80 redirect to :$PORTAL_PORT
    }

    # Protect the box's own services from LAN clients (SSH/admin unreachable).
    chain input {
        type filter hook input priority filter; policy accept;

        iifname "lo" accept
        ct state established,related accept

        iifname $LAN_IF ether saddr @blocked drop
        iifname $LAN_IF ether saddr @whitelist accept
        # SYN-flood protection.
        iifname $LAN_IF tcp flags syn ct state new limit rate over 60/second burst 100 packets drop
        iifname $LAN_IF udp dport 67 accept
        iifname $LAN_IF ip saddr != $CLIENT_NET drop
        iifname $LAN_IF udp dport 53 accept
        iifname $LAN_IF tcp dport { 53, $PORTAL_PORT } accept
        iifname $LAN_IF icmp type echo-request accept
        iifname $LAN_IF meta l4proto tcp reject with tcp reset
        iifname $LAN_IF reject
        iifname $WAN_IF drop
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
#@OFFLOAD@
        iifname $LAN_IF ether saddr @blocked drop
        # Block outbound spam so customer malware can't flag your ISP account.
        iifname $LAN_IF tcp dport { 25, 465, 587 } drop
        # Per-client connection cap (protects the conntrack table).
        iifname $LAN_IF ct state new update @conn_limit { ip saddr ct count over 2000 } drop
        # SYN-flood protection on forwarded traffic too.
        iifname $LAN_IF tcp flags syn ct state new limit rate over 200/second burst 200 packets drop

        iifname $LAN_IF ether saddr @allowed accept
        iifname $LAN_IF ether saddr @whitelist accept
        iifname $LAN_IF ip daddr @walled accept
        oifname $LAN_IF ct state established,related accept

        # Fast-fail unpaid so the OS captive popup appears (see design notes).
        iifname $LAN_IF meta l4proto tcp reject with tcp reset
        iifname $LAN_IF reject
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN_IF masquerade
    }

#@ANTI_TETHER@
}
