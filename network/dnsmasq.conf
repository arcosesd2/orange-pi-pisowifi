# PisoWiFi DHCP + DNS on the LAN interface only.
interface=wlan0
bind-interfaces
except-interface=eth0

dhcp-range=10.0.0.10,10.0.0.250,255.255.255.0,2h
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1

# RFC 8910 captive-portal option: modern phones (Android 11+/iOS 14+) query
# this API and pin a persistent "Sign in to network" notification until the
# API says the client is no longer captive (i.e. has paid time).
dhcp-option=114,http://10.0.0.1:8080/api/capport

# Honest DNS (no wildcard poisoning) — captive detection works via the
# port-80 redirect in nftables, and paid clients need real answers.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Convenience name for the portal.
address=/piso.wifi/10.0.0.1
