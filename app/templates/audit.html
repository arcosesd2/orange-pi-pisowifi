<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ name }} — Audit log</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#fbbf24; --txt:#e2e8f0; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt);
         padding:24px 16px; max-width:820px; margin:0 auto; }
  h1 { color:var(--accent); font-size:1.3rem; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; }
  td, th { padding:7px 9px; border-bottom:1px solid #334155; font-size:.85rem; text-align:left; }
  nav a { color:#94a3b8; margin-right:14px; text-decoration:none; font-size:.9rem; }
  nav a.here { color:var(--accent); font-weight:700; }
  nav { margin-bottom:16px; }
  .muted { color:#94a3b8; }
</style>
</head>
<body>
  <h1>📝 {{ name }} — Audit log</h1>
  <nav>
    <a href="/admin">Dashboard</a>
    <a href="/admin/vouchers">Vouchers</a>
    <a href="/admin/devices">Devices</a>
    <a class="here" href="/admin/audit">Audit</a>
    <a href="/admin/diag">Diagnostics</a>
    <a href="/admin/logout">Logout</a>
  </nav>
  <table>
    <tr><th>When</th><th>IP</th><th>Action</th><th>Detail</th></tr>
    {% for e in entries %}
    <tr>
      <td class="muted">{{ e.at | int | ts }}</td>
      <td>{{ e.ip or '' }}</td>
      <td>{{ e.action }}</td>
      <td class="muted">{{ e.detail or '' }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">No entries yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
