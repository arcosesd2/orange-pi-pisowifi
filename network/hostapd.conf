# PisoWiFi access point (only needed for the USB-WiFi topology;
# skip hostapd entirely if you use an external router/AP as the LAN).
interface=wlan0
driver=nl80211

ssid=PISO WIFI - INSERT COIN
hw_mode=g
channel=6
country_code=PH

# Open network — the captive portal is the gate, not WPA.
auth_algs=1
wpa=0

# Client isolation: stop customers from reaching each other over the air
# (ARP spoofing, SMB probes, etc.). The portal/gateway still works because
# that traffic goes to the AP/router, not peer-to-peer.
ap_isolate=1

# Client limits (the OPi One + USB dongle won't handle many more).
max_num_sta=20
ignore_broadcast_ssid=0
