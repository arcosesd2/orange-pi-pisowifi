{# Standalone: no nav, because there is nothing to navigate to until you are in. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PisoWiFi — Log in</title>
<link rel="stylesheet" href="/static/admin.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px; }
  .login { width:100%; max-width:340px; margin:0; }
  .login .lock { font-size:1.6rem; }
  .login h1 { font-size:1.1rem; margin:6px 0 2px; color:var(--accent); }
</style>
</head>
<body>
  <form class="card login" method="post">
    <div class="lock">🔐</div>
    <h1>PisoWiFi admin</h1>
    <p class="muted">Enter the admin password for this machine.</p>

    {% if error %}<div class="notice bad" style="margin-top:12px">{{ error }}</div>{% endif %}

    <label for="pw">Password</label>
    <input id="pw" type="password" name="password" autofocus autocomplete="current-password">

    <div class="actions"><button style="width:100%">Log in</button></div>
  </form>
</body>
</html>
